<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SiteSureLabs — Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Tangerine:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/styles.css" />
  <style>
    .auth-card.auth-card--register {
      max-width: 420px;
    }
    .register-steps {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .register-steps__dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #cbd5e1;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .register-steps__dot.active {
      background: #2563eb;
      transform: scale(1.15);
    }
    .register-slide { display: none; }
    .register-slide.active { display: block; }
    .register-nav {
      display: flex;
      gap: 0.6rem;
      margin-top: 1.25rem;
    }
    .register-nav .btn { flex: 1; }
    .register-nav .btn:only-child { flex: 0 0 100%; }
    .auth-card--register .field-hint {
      display: block;
      margin-top: 0.35rem;
      font-size: var(--auth-size-field-error);
      color: #64748b;
      line-height: 1.35;
    }
    .register-phone-wrap {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: stretch;
      border: 1px solid var(--auth-field-border);
      border-radius: 8px;
      background: var(--auth-field-bg);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .register-phone-wrap:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
    }
    .form-group.has-error .register-phone-wrap {
      border-color: var(--danger);
    }
    .register-phone-prefix {
      display: inline-flex;
      align-items: center;
      padding: 0 0.85rem;
      border-right: 1px solid var(--auth-field-border);
      color: #0f172a;
      font-weight: 600;
      font-size: var(--auth-size-input);
      background: rgba(248, 250, 252, 0.85);
      border-radius: 7px 0 0 7px;
    }
    .register-phone-wrap input {
      border: 0;
      box-shadow: none;
      background: transparent;
      border-radius: 0 7px 7px 0;
    }
    .register-phone-wrap input:focus {
      box-shadow: none;
      outline: none;
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card auth-card--register">
    <div class="auth-header">
    <div class="brand-logo">
      <img src="/assets/new_logo.png" alt="SiteSureLabs" width="56" height="56" decoding="async" />
      <span class="logo-text">SiteSureLabs</span>
    </div>
    <p class="subtitle">Create a new account</p>
    </div>
    <div class="register-steps" aria-hidden="true">
      <span class="register-steps__dot active" id="step-dot-1"></span>
      <span class="register-steps__dot" id="step-dot-2"></span>
    </div>

    <div id="alert" class="alert"></div>

    <form id="registerForm" autocomplete="on" novalidate>
      <div class="register-slide active" id="register-slide-1">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="Enter your mail" required autocomplete="email" aria-describedby="email-error" />
          <span id="email-error" class="field-error" role="alert"></span>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-field-wrap">
            <input id="password" type="password" placeholder="At least 4 characters" required minlength="4" autocomplete="new-password" aria-describedby="password-error" />
            <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password" aria-pressed="false"></button>
          </div>
          <span id="password-error" class="field-error" role="alert"></span>
        </div>
        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <div class="password-field-wrap">
            <input id="confirm" type="password" placeholder="Re-enter password" required minlength="4" autocomplete="new-password" aria-describedby="confirm-error" />
            <button type="button" class="password-toggle" id="confirm-toggle" aria-label="Show password" aria-pressed="false"></button>
          </div>
          <span id="confirm-error" class="field-error" role="alert"></span>
        </div>
        <div class="register-nav">
          <button type="button" class="btn btn-primary btn-full" id="nextStepBtn">Next</button>
        </div>
      </div>

      <div class="register-slide" id="register-slide-2">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input
            id="fullName"
            type="text"
            maxlength="80"
            placeholder="Enter your full name"
            required
            autocomplete="name"
            aria-describedby="fullName-error"
          />
          <span id="fullName-error" class="field-error" role="alert"></span>
        </div>
        <div class="form-group">
          <label for="mobile">Mobile Number</label>
          <div class="register-phone-wrap">
            <span class="register-phone-prefix" aria-hidden="true">+91</span>
            <input
              id="mobile"
              type="tel"
              inputmode="numeric"
              maxlength="10"
              placeholder="Enter your mobile number"
              required
              autocomplete="tel-national"
              aria-label="Mobile number without country code"
              aria-describedby="mobile-error"
            />
          </div>
          <span id="mobile-error" class="field-error" role="alert"></span>
        </div>
        <div class="register-nav">
          <button type="button" class="btn btn-outline" id="backStepBtn">Back</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">Register</button>
        </div>
      </div>
    </form>

    <p class="auth-link">Already have an account? <a href="/">Login</a></p>
  </div>

  <script type="module">
    import { getUser } from "/shared/auth.js";
    import { wirePasswordToggle } from "/shared/password-toggle.js";

    const user = getUser();
    if (user) {
      window.location.href = user.role === "admin" ? "/admin/" : "/inspect/";
    }

    const form = document.getElementById("registerForm");
    const alertEl = document.getElementById("alert");
    const submitBtn = document.getElementById("submitBtn");
    const nextStepBtn = document.getElementById("nextStepBtn");
    const backStepBtn = document.getElementById("backStepBtn");
    const slide1 = document.getElementById("register-slide-1");
    const slide2 = document.getElementById("register-slide-2");
    const dot1 = document.getElementById("step-dot-1");
    const dot2 = document.getElementById("step-dot-2");
    wirePasswordToggle(document.getElementById("password"), document.getElementById("password-toggle"));
    wirePasswordToggle(document.getElementById("confirm"), document.getElementById("confirm-toggle"));

    const MOBILE_RE = /^[6789]\d{9}$/;
    const NAME_RE = /^[A-Za-z]+(?: [A-Za-z]+)*$/;
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirm");
    const mobileInput = document.getElementById("mobile");
    const fullNameInput = document.getElementById("fullName");
    const emailErrorEl = document.getElementById("email-error");
    const passwordErrorEl = document.getElementById("password-error");
    const confirmErrorEl = document.getElementById("confirm-error");
    const mobileErrorEl = document.getElementById("mobile-error");
    const fullNameErrorEl = document.getElementById("fullName-error");
    const emailGroup = emailInput.closest(".form-group");
    const passwordGroup = passwordInput.closest(".form-group");
    const confirmGroup = confirmInput.closest(".form-group");
    const mobileGroup = mobileInput.closest(".form-group");
    const fullNameGroup = fullNameInput.closest(".form-group");

    function setFieldError(inputEl, errorEl, groupEl, msg) {
      if (msg) {
        errorEl.textContent = msg;
        errorEl.classList.add("visible");
        groupEl?.classList.add("has-error");
        inputEl.setAttribute("aria-invalid", "true");
      } else {
        errorEl.textContent = "";
        errorEl.classList.remove("visible");
        groupEl?.classList.remove("has-error");
        inputEl.removeAttribute("aria-invalid");
      }
    }

    function hideAlert() {
      alertEl.className = "alert";
      alertEl.textContent = "";
    }

    function clearStep1FieldErrors() {
      setFieldError(emailInput, emailErrorEl, emailGroup, "");
      setFieldError(passwordInput, passwordErrorEl, passwordGroup, "");
      setFieldError(confirmInput, confirmErrorEl, confirmGroup, "");
    }

    function clearStep2FieldErrors() {
      setFieldError(mobileInput, mobileErrorEl, mobileGroup, "");
      setFieldError(fullNameInput, fullNameErrorEl, fullNameGroup, "");
    }

    function clearAllFieldErrors() {
      clearStep1FieldErrors();
      clearStep2FieldErrors();
    }

    function sanitizeFullNameInput() {
      fullNameInput.value = fullNameInput.value.replace(/[^A-Za-z ]/g, "");
    }

    fullNameInput.addEventListener("input", () => {
      sanitizeFullNameInput();
      if (NAME_RE.test(fullNameInput.value.trim().replace(/\s+/g, " "))) {
        setFieldError(fullNameInput, fullNameErrorEl, fullNameGroup, "");
      }
    });
    fullNameInput.addEventListener("paste", (e) => {
      e.preventDefault();
      const pasted = (e.clipboardData?.getData("text") || "").replace(/[^A-Za-z ]/g, "");
      const start = fullNameInput.selectionStart ?? fullNameInput.value.length;
      const end = fullNameInput.selectionEnd ?? fullNameInput.value.length;
      fullNameInput.value = (fullNameInput.value.slice(0, start) + pasted + fullNameInput.value.slice(end))
        .replace(/[^A-Za-z ]/g, "")
        .slice(0, 80);
    });

    function sanitizeMobileInput() {
      mobileInput.value = mobileInput.value.replace(/\D/g, "").slice(0, 10);
    }

    mobileInput.addEventListener("input", () => {
      sanitizeMobileInput();
      if (MOBILE_RE.test(mobileInput.value)) {
        setFieldError(mobileInput, mobileErrorEl, mobileGroup, "");
      }
    });
    mobileInput.addEventListener("paste", (e) => {
      e.preventDefault();
      const pasted = (e.clipboardData?.getData("text") || "").replace(/\D/g, "").slice(0, 10);
      const start = mobileInput.selectionStart ?? mobileInput.value.length;
      const end = mobileInput.selectionEnd ?? mobileInput.value.length;
      const merged = (mobileInput.value.slice(0, start) + pasted + mobileInput.value.slice(end))
        .replace(/\D/g, "")
        .slice(0, 10);
      mobileInput.value = merged;
    });

    function showAlert(msg, type) {
      alertEl.textContent = msg;
      alertEl.className = `alert alert-${type} show`;
    }

    /** FastAPI may return `detail` as a string or a list of validation errors */
    function formatApiDetail(data) {
      const d = data && data.detail;
      if (typeof d === "string") return d;
      if (Array.isArray(d))
        return d.map((e) => (e && (e.msg || e.message)) || JSON.stringify(e)).join(" ");
      return "Registration failed";
    }

    function goToStep(step, { clearErrors = false } = {}) {
      const isStep2 = step === 2;
      slide1.classList.toggle("active", !isStep2);
      slide2.classList.toggle("active", isStep2);
      dot1.classList.toggle("active", !isStep2);
      dot2.classList.toggle("active", isStep2);
      if (clearErrors) {
        hideAlert();
        clearAllFieldErrors();
      }
    }

    function validateStep1() {
      hideAlert();
      clearStep1FieldErrors();

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirm = confirmInput.value;
      let valid = true;

      if (!email) {
        setFieldError(emailInput, emailErrorEl, emailGroup, "Email is required");
        valid = false;
      } else if (!EMAIL_RE.test(email)) {
        setFieldError(emailInput, emailErrorEl, emailGroup, "Enter a valid email address");
        valid = false;
      }
      if (password.length < 4) {
        setFieldError(passwordInput, passwordErrorEl, passwordGroup, "Password must be at least 4 characters");
        valid = false;
      }
      if (password !== confirm) {
        setFieldError(confirmInput, confirmErrorEl, confirmGroup, "Passwords do not match");
        valid = false;
      }

      if (!valid) {
        if (!email) emailInput.focus();
        else if (!EMAIL_RE.test(email)) emailInput.focus();
        else if (password.length < 4) passwordInput.focus();
        else confirmInput.focus();
      }
      return valid;
    }

    [emailInput, passwordInput, confirmInput].forEach((input) => {
      input.addEventListener("input", () => {
        const id = input.id;
        if (id === "email" && input.value.trim() && EMAIL_RE.test(input.value.trim())) {
          setFieldError(emailInput, emailErrorEl, emailGroup, "");
        } else if (id === "password" && input.value.length >= 4) {
          setFieldError(passwordInput, passwordErrorEl, passwordGroup, "");
        } else if (id === "confirm" && input.value === passwordInput.value) {
          setFieldError(confirmInput, confirmErrorEl, confirmGroup, "");
        }
      });
    });

    nextStepBtn.addEventListener("click", () => {
      if (validateStep1()) goToStep(2, { clearErrors: true });
    });
    backStepBtn.addEventListener("click", () => goToStep(1, { clearErrors: true }));

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      const name = fullNameInput.value.trim().replace(/\s+/g, " ");
      const mobile = mobileInput.value.trim();

      hideAlert();

      if (!validateStep1()) {
        goToStep(1);
        return;
      }

      clearStep2FieldErrors();

      slide1.classList.remove("active");
      slide2.classList.add("active");
      dot1.classList.remove("active");
      dot2.classList.add("active");

      if (!name || name.length < 2) {
        const msg = "Full name is required (at least 2 letters)";
        setFieldError(fullNameInput, fullNameErrorEl, fullNameGroup, msg);
        fullNameInput.focus();
        return;
      }
      if (!NAME_RE.test(name)) {
        const msg = "Full name can only contain letters and spaces";
        setFieldError(fullNameInput, fullNameErrorEl, fullNameGroup, msg);
        fullNameInput.focus();
        return;
      }
      if (!MOBILE_RE.test(mobile)) {
        setFieldError(mobileInput, mobileErrorEl, mobileGroup, "Enter a valid number");
        mobileInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account…";

      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, name, mobile }),
        });
        const data = await res.json();

        if (!res.ok) {
          const detail = formatApiDetail(data);
          hideAlert();
          clearAllFieldErrors();
          const lower = detail.toLowerCase();
          if (lower.includes("email")) {
            goToStep(1);
            setFieldError(emailInput, emailErrorEl, emailGroup, detail);
            emailInput.focus();
          } else if (lower.includes("password")) {
            goToStep(1);
            setFieldError(passwordInput, passwordErrorEl, passwordGroup, detail);
            passwordInput.focus();
          } else if (lower.includes("name")) {
            setFieldError(fullNameInput, fullNameErrorEl, fullNameGroup, detail);
            fullNameInput.focus();
          } else if (lower.includes("number") || lower.includes("mobile")) {
            setFieldError(mobileInput, mobileErrorEl, mobileGroup, detail);
            mobileInput.focus();
          } else {
            showAlert(detail, "error");
          }
          return;
        }

        showAlert("Account created! Redirecting to login…", "success");
        setTimeout(() => (window.location.href = "/"), 1200);
      } catch {
        showAlert("Network error — is the server running?", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Register";
      }
    });
  </script>
</body>
</html>
